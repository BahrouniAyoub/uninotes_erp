<!DOCTYPE html>
{% load static %}
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniNotes ERP</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-inner">
        <a class="brand" href="{% url 'home' %}">UniNotes ERP</a>

        <div class="nav-actions">
          {% if user.is_authenticated %}
            <span class="user-pill">{{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" class="inline-form">
              {% csrf_token %}
              <button class="btn btn-light" type="submit">Déconnexion</button>
            </form>
          {% else %}
            <a class="nav-link" href="{% url 'login' %}">Connexion</a>
            <a class="btn btn-light" href="{% url 'register' %}">Inscription</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container">
      {% if messages %}
        <div class="messages">
          {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}

      {% endblock %}
    </main>
  </body>
</html>
